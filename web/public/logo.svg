<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Subtle back shield glow -->
  <rect width="48" height="48" rx="12" fill="url(#bg-gradient)"/>
  
  <!-- Outer Protective Shield Path -->
  <path d="M24 7L38 12.5V23.2C38 31.8 32.1 39.7 24 42C15.9 39.7 10 31.8 10 23.2V12.5L24 7Z" 
        fill="url(#shield-gradient)" 
        stroke="rgba(255,255,255,0.18)" 
        stroke-width="1.2"/>
  
  <!-- Interlinked Crisis Emergency Node Network / Pulse -->
  <path d="M17 25H21L23 20L25 29L27 23L28.5 25H31" 
        stroke="#38BDF8" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Center Link Beacon -->
  <circle cx="24" cy="16.5" r="2.2" fill="#38BDF8"/>
  <circle cx="17" cy="25" r="1.6" fill="#FFFFFF"/>
  <circle cx="31" cy="25" r="1.6" fill="#FFFFFF"/>
  <circle cx="24" cy="33.5" r="1.8" fill="#38BDF8"/>

  <!-- Connection Links -->
  <line x1="24" y1="18.7" x2="24" y2="20" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="29" x2="24" y2="31.7" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.2" stroke-linecap="round"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="shield-gradient" x1="10" y1="7" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
</svg>
